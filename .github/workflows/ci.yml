name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Schemas are current
        run: |
          bun run schemas
          test -z "$(git status --porcelain -- spec/schemas)" || { git --no-pager diff -- spec/schemas; echo 'spec/schemas is out of date: run bun run schemas and commit'; exit 1; }

      - name: Audit dependencies
        # The registry sometimes drops the audit connection from a hosted runner and
        # bun waits minutes before giving up; on other days it answers slowly. Give
        # each attempt three minutes and try three times.
        run: |
          for attempt in 1 2 3; do
            timeout 180 bun audit && exit 0
            echo "audit attempt ${attempt} did not complete"
            sleep 20
          done
          exit 1
