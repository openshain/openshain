name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Audit dependencies
        # The registry sometimes drops the audit connection from a hosted runner and
        # bun waits minutes before giving up; on other days it answers slowly. Give
        # each attempt three minutes and try three times.
        run: |
          for attempt in 1 2 3; do
            timeout 180 bun audit && exit 0
            echo "audit attempt ${attempt} did not complete"
            sleep 20
          done
          exit 1
