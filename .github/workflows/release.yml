name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Build binaries for each platform
        run: |
          mkdir -p dist
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            bun build --compile --target "$target" packages/cli/src/bin.ts --outfile "dist/openshain-${target#bun-}"
          done
          (cd dist && sha256sum openshain-* > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: openshain-binaries
          path: dist/

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0} p && !/^## /' CHANGELOG.md > notes.md
          printf '\nmacOS のバイナリは署名していません。ダウンロード後に `xattr -d com.apple.quarantine openshain-darwin-*` で隔離属性を外してください。\n' >> notes.md
          cat notes.md

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/openshain-* dist/SHA256SUMS --title "openshain ${GITHUB_REF_NAME#v}" --notes-file notes.md
