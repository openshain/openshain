name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Build binaries for each platform
        run: |
          mkdir -p dist
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            bun scripts/build.ts --target "$target" --outfile "dist/openshain-${target#bun-}"
          done
          (cd dist && sha256sum openshain-* > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openshain-binaries
          path: dist/

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0} p && !/^## / && !/^\[/' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "CHANGELOG.md has no section for [$version]; add it before tagging" >&2
            exit 1
          fi
          printf '\nmacOS のバイナリは署名していません。ダウンロード後に `xattr -d com.apple.quarantine openshain-darwin-*` で隔離属性を外してください。\n' >> notes.md
          cat notes.md

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/openshain-* dist/SHA256SUMS --title "openshain ${GITHUB_REF_NAME#v}" --notes-file notes.md
