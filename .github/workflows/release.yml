name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish this existing tag to npm again (the build and the GitHub Release are not repeated)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            version="$(bun -e "console.log(JSON.parse(require('fs').readFileSync('$pkg','utf8')).version)")"
            if [ "$version" != "$tag" ]; then
              echo "$pkg has version $version but the tag is v$tag; align them before tagging" >&2
              exit 1
            fi
          done
          # bun publish takes workspace versions from bun.lock; a stale lockfile publishes
          # a CLI that depends on the previous release.
          if [ "$(grep -c "\"version\": \"$tag\"" bun.lock)" -lt 5 ]; then
            echo "bun.lock does not carry version $tag for every workspace package; update it before tagging" >&2
            exit 1
          fi

      - name: Build binaries for each platform
        run: |
          mkdir -p dist
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            bun scripts/build.ts --target "$target" --outfile "dist/openshain-${target#bun-}"
          done
          (cd dist && sha256sum openshain-* > SHA256SUMS)
          test -s dist/THIRD-PARTY-NOTICES.txt
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshain-binaries
          path: dist/

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0} p && !/^## / && !/^\[/' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "CHANGELOG.md has no section for [$version]; add it before tagging" >&2
            exit 1
          fi
          printf '\nmacOS のバイナリは署名していません。ダウンロード後に `xattr -d com.apple.quarantine openshain-darwin-*` で隔離属性を外してください。\n' >> notes.md
          cat notes.md

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.2.0-rc.1, v0.2.0-beta.2) is a prerelease; only vX.Y.Z is stable.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/openshain-* dist/SHA256SUMS dist/THIRD-PARTY-NOTICES.txt --title "openshain ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease

      - name: Tell the website about a stable release
        # The website builds from the commit named here. See docs/website-integration.md.
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          WEBSITE_REPOSITORY: ${{ vars.WEBSITE_REPOSITORY }}
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEBSITE_REPOSITORY" ] || [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_REPOSITORY or WEBSITE_DISPATCH_TOKEN is not set; the website is not told about this release"
            exit 0
          fi
          gh api "repos/$WEBSITE_REPOSITORY/dispatches" \
            -f event_type=openshain-release \
            -f "client_payload[tag]=$GITHUB_REF_NAME" \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}" \
            -f "client_payload[sha]=$GITHUB_SHA" \
            -f "client_payload[release_url]=https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

  publish:
    # Publishes the five packages to npm through trusted publishing (OIDC): no npm token is
    # stored anywhere. The environment carries the required reviewer, so a person approves
    # each publish. bun publish has no OIDC support yet, so the publish step itself is npm's.
    needs: build
    if: always() && ((startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success') || inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: npm 11.5.1 or later, which trusted publishing needs
        run: |
          npm install -g npm@11
          npm --version

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build:packages

      - name: Pin workspace dependencies to the released version
        run: bun scripts/pin-workspace-versions.ts "${RELEASE_TAG#v}"

      - name: Show what npm will present to the registry
        # The OIDC token's claims (no signature) and the registry's answer to the exchange, so a
        # mismatch with the trusted publisher settings on npmjs.com is visible in the log.
        run: |
          id_token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "$id_token" | cut -d. -f2 | tr '_-' '/+' | awk '{ l = length($0) % 4; if (l) printf "%s%s", $0, substr("==", 1, 4 - l); else print $0 }' | base64 -d 2>/dev/null | jq '{repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, event_name, aud}'
          status="$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" -H 'Content-Type: application/json' https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40openshain%2Fcore)"
          echo "exchange for @openshain/core: HTTP $status"
          jq 'del(.token)' /tmp/exchange.json 2>/dev/null || cat /tmp/exchange.json

      - name: Publish in dependency order
        # A tag with a suffix goes to the next dist-tag and leaves latest alone.
        shell: bash
        run: |
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=next; fi
          for p in core tools agent mcp cli; do
            (cd "packages/$p" && npm publish --access public --provenance --tag "$tag" --loglevel verbose 2>&1 | grep -viE 'authorization|_authToken|bearer' )
            test "${PIPESTATUS[0]}" -eq 0
          done
