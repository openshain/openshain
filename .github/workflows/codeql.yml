name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 03:17 UTC. New queries arrive without the code changing, so the analysis runs
    # weekly as well as on every change.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      # Findings go to the repository's code scanning results.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # The packages are TypeScript read straight from source; nothing is compiled first.
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: javascript-typescript
