# Rules for the invariants of this codebase, on top of the public rulesets.
# Run: docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep semgrep --config .semgrep packages
rules:
- id: openshain-tool-runs-without-the-policy
  languages:
  - typescript
  severity: ERROR
  message: A tool provider is called outside callTool, so authority/ never judged this call. Every call must go through createToolCaller in packages/core/src/runtime.ts.
  patterns:
  - pattern: $TOOL.provider.call(...)
  - pattern-not-inside: async function callTool(...) { ... }
- id: openshain-approval-decided-without-a-decider
  languages:
  - typescript
  severity: ERROR
  message: approval.decided is recorded without naming who decided; the record must say by whom.
  patterns:
  - pattern: '$H.append({ type: "approval.decided", payload: $P })'
  - pattern-not: '$H.append({ type: "approval.decided", payload: { ..., by: $BY, ... } })'
- id: openshain-secret-reaches-a-log-line
  languages:
  - typescript
  severity: ERROR
  message: An API key or a token must never reach a log line or the screen.
  pattern-either:
  - pattern: console.log(<... process.env[$K] ...>)
  - pattern: console.error(<... process.env[$K] ...>)
  - pattern: console.log(<... $M.apiKey ...>)
- id: openshain-work-opened-without-closing-it
  languages:
  - typescript
  severity: ERROR
  message: A work is opened through withWork, which closes it however the call ends. Opening it here leaves the single-writer lock to a finally somebody has to remember.
  paths:
    include:
    - "packages/mcp/src/*.ts"
    exclude:
    - "*.test.ts"
  patterns:
  - pattern: $STORE.open($ID)
  - pattern-not-inside: 'async function withWork<T>(id: WorkId, use: (opened: WorkHandle) => Promise<T>): Promise<T> { ... }'
- id: openshain-workspace-file-read-outside-the-guard
  languages:
  - typescript
  severity: ERROR
  message: A file of the company folder is read and written through readWorkspaceText and writeWorkspaceText, which apply the path guard and the size limit. node:fs here goes around both, and hashing what the checks refuse to read is how the two stop agreeing on what is in the folder. Only the build output of knowledge/ is read directly, and only after its hashes are matched.
  paths:
    include:
    - "packages/tools/src/*.ts"
    - "packages/cli/src/preview.ts"
    - "packages/core/src/knowledge/*.ts"
    exclude:
    - "*.test.ts"
  patterns:
  - pattern-either:
    - pattern: readFile(...)
    - pattern: writeFile(...)
  - pattern-not-regex: (INDEX_FILE|MANIFEST_FILE|index\.json|manifest\.json)
  # The one writer of the build output: a temporary file renamed into place, so a reader never
  # sees half of it.
  - pattern-not-inside: 'async function atomicWrite(path: string, text: string): Promise<void> { ... }'
- id: openshain-screen-text-not-cleaned
  languages:
  - typescript
  severity: ERROR
  message: A line reaches the screen without plain(). A model's reply, a Tool result or a file's content can carry escape sequences that move the cursor, retitle the window or write the clipboard. The screen draws what is added here, markdown included, so this is the one place it is cleaned.
  patterns:
  - pattern: '$S.entries = [...$REST, { ..., text: $T, ... }]'
  - pattern-not: '$S.entries = [...$REST, { ..., text: plain(...), ... }]'
- id: openshain-work-status-set-outside-the-state-machine
  languages:
  - typescript
  severity: WARNING
  message: A work's status is assigned outside move(), the reducer's own helper, which calls transition() first. Status changes come from events, never from an assignment.
  patterns:
  - pattern: $W.status = $S
  - pattern-not-inside: 'function move(work: Work, to: WorkStatus, at: string) { ... }'
